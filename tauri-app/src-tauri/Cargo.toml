[package]
name = "lightgap"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lightgap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

# The whole stack below the application. Everything with a protocol decision in
# it lives here rather than in the app, where it can be tested without hardware.
modem = { path = "../../crates/modem" }
optical-codec = { path = "../../crates/optical-codec" }
optical-protocol = { path = "../../crates/optical-protocol" }
tauri-plugin-log = "2.9.0"
log = "0.4.33"
link-calibration = { version = "0.1.0", path = "../../crates/link-calibration" }

# Desktop only. The crate is `#![cfg(not(android/ios))]` at its root, so on
# mobile it compiles to nothing and any use of it fails to resolve — and a
# window whose size and position are worth remembering is a desktop idea to
# begin with.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2.4.1"

[dev-dependencies]
# The synthetic camera, so the engine can be exercised without a window or a
# webcam. Testing the pacing and the frame path by launching the app and looking
# at it would verify nothing repeatably.
optical-codec = { path = "../../crates/optical-codec" }
