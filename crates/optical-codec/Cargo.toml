[package]
name = "optical-codec"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Optical frame (QR) encoding and decoding, plus framing geometry"

[dependencies]
optical-protocol = { path = "../optical-protocol" }
qrcode = { version = "0.14", default-features = false }
rqrr = "0.9"
# The scan result crosses the process boundary: the decode happens in the
# interface and the engine consumes what came out of it.
serde = { version = "1", features = ["derive"] }
thiserror.workspace = true

[dev-dependencies]
rand = "0.9"
rand_chacha = "0.9"
