name: Release

# Runs on a tag, and on demand so the packaging can be exercised without
# spending a version number to find out it is broken.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    steps:
      - uses: actions/checkout@v4

      - name: System libraries Tauri links against
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      # `beforeBuildCommand` runs trunk, so the frontend is built as part of
      # this rather than needing its own step.
      #
      # Unsigned, deliberately. Signing needs certificates, and a certificate
      # in a repository's secrets is a decision to make on purpose rather than
      # a step to add while wiring up a build.
      - name: Build
        working-directory: tauri-app
        run: cargo tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: lightgap-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.app

  android:
    name: android apk
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      # Build what is committed. `android init` would regenerate this tree
      # correctly and destroy the edits in it: the camera and audio
      # permissions, WAKE_LOCK, the keep-screen-on and brightness handling in
      # MainActivity, and the brightness plugin. Those are the difference
      # between an application that can hold an optical link and one that
      # cannot.
      - name: Build
        working-directory: tauri-app
        run: cargo tauri android build --apk --debug --target aarch64

      # Debug, and named so. A debug APK is a few hundred megabytes because
      # nothing is stripped; a release build is a fraction of that and needs a
      # signing key, which is the same deliberate decision as the desktop
      # certificates above.
      - uses: actions/upload-artifact@v4
        with:
          name: lightgap-android-debug
          if-no-files-found: error
          path: tauri-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
