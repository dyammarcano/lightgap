[workspace]
resolver = "2"
members = [
    "tauri-app",
    "tauri-app/src-tauri",
    "crates/optical-protocol",
    "crates/channel-sim",
    "crates/optical-codec",
    "crates/link-calibration",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Shared across crates. Phase-specific ones live in their own crate.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# QR decoding and audio DSP run in debug during development. Without this they
# are too slow to evaluate the link realistically.
[profile.dev.package."*"]
opt-level = 2
